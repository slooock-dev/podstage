name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev tools)
        run: pip install -e '.[dev]'
      # Lint everything, including the GUI modules: ruff parses them statically,
      # so no PyQt6/GPU/display is needed here.
      - name: Lint
        run: ruff check src/ tests/
      # The suite is headless and hardware-free (PyQt6 is intentionally NOT
      # installed, mirroring the local system-Python test run).
      - name: Test
        run: pytest -q

  # pytest runs without PyQt6, so ui/ errors stay green there — byte-compile
  # the GUI modules and boot the window offscreen once.
  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libdbus-1-3
      - name: Install (core + GUI)
        run: pip install -e '.[ui]'
      - name: Byte-compile GUI modules
        run: python -m compileall -q src/podstage/ui
      - name: Offscreen smoke test
        run: QT_QPA_PLATFORM=offscreen python tools/gui_smoke.py
